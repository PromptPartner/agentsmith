<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">AgentSmith — das Open-Source-Harness für Coding-Agenten</title>
  <desc id="desc">Claude Code oder Codex arbeitet mit Projektregeln und konfigurierten Prüfungen. Aufgabe definieren, Änderung begrenzen, Prüfungen und tatsächlichen Ablauf testen, Belege bewahren, Arbeit übergeben und Verbesserungen aus beobachteten Fehlern validieren. Teste die Demo der ersten verifizierten Schleife in einer Wegwerfumgebung. Anweisungen lenken das Verhalten; konfigurierte Prüfungen setzen bestimmte Grenzen durch.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#ffa600" stroke-width="1.5"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#f8fafc}
      .muted{fill:#bdc7d9}.gold{fill:#ffa600}.card{fill:#172238;stroke:#455575;stroke-width:2}
      .edge{fill:none;stroke:#ffa600;stroke-width:2.5;marker-end:url(#arrow)}
      .heading{font-size:25px;font-weight:700}.body{font-size:21px}.small{font-size:19px}
    </style>
  </defs>
  <rect width="1400" height="980" fill="#090e1a"/>
  <text x="700" y="65" text-anchor="middle" font-size="48" font-weight="700">AgentSmith</text>
  <text x="700" y="108" text-anchor="middle" font-size="25" class="muted">Das Open-Source-Harness für Coding-Agenten</text>
  <text x="700" y="154" text-anchor="middle" font-size="29" font-weight="700" class="gold">Erst der Beleg, dann „fertig“.</text>
  <text x="700" y="180" text-anchor="middle" font-size="18" class="muted">Vom Vibe Coding zum Agentic Engineering</text>
  <rect x="50" y="202" width="270" height="92" rx="18" class="card"/>
  <text x="185" y="240" text-anchor="middle" class="heading">Deine Aufgabe</text>
  <text x="185" y="272" text-anchor="middle" class="small muted" style="font-size:17px">Umfang + Definition von „fertig“</text>
  <rect x="425" y="190" width="550" height="115" rx="20" fill="#ffa600"/>
  <text x="700" y="236" text-anchor="middle" font-size="27" font-weight="700" style="fill:#090e1a">Claude Code oder Codex + AgentSmith</text>
  <text x="700" y="275" text-anchor="middle" font-size="21" style="fill:#090e1a">Projektregeln · konfigurierte Prüfungen · Übergaben</text>
  <rect x="1080" y="202" width="270" height="92" rx="18" class="card"/>
  <text x="1215" y="240" text-anchor="middle" class="heading">Ergebnis prüfen</text>
  <text x="1215" y="272" text-anchor="middle" class="small muted" style="font-size:17px">Änderungen + gesicherte Belege</text>
  <path d="M325 248 H405" class="edge"/><path d="M982 248 H1060" class="edge"/>
  <rect x="50" y="357" width="410" height="287" rx="22" class="card"/>
  <text x="80" y="402" class="heading gold">1  Verstehen und begrenzen</text>
  <text x="80" y="451" class="body">Bestehenden Code und Aufrufer lesen.</text>
  <text x="80" y="491" class="body" style="font-size:18px">Umfang und Abschlussprüfungen klären.</text>
  <text x="80" y="531" class="body" style="font-size:19px">Kleine, überprüfbare Änderungen machen.</text>
  <text x="80" y="580" class="small muted">Native Berechtigungen bewusst wählen.</text>
  <text x="80" y="611" class="small muted" style="font-size:17px">Optionale Hooks zur Geheimnissuche nutzen.</text>
  <rect x="495" y="357" width="410" height="287" rx="22" class="card"/>
  <text x="525" y="402" class="heading gold">2  Prüfen und Belege sichern</text>
  <text x="525" y="451" class="body" style="font-size:19px">Fehler vor der Korrektur reproduzieren.</text>
  <text x="525" y="491" class="body" style="font-size:19px">Alle konfigurierten Prüfungen ausführen.</text>
  <text x="525" y="531" class="body" style="font-size:19px">Den tatsächlichen Nutzerablauf testen.</text>
  <text x="525" y="580" class="small muted">Ergebnisse im Prüfprotokoll festhalten.</text>
  <text x="525" y="611" class="small muted">Prüfen, was die Belege abdecken.</text>
  <rect x="940" y="357" width="410" height="287" rx="22" class="card"/>
  <text x="970" y="402" class="heading gold" style="font-size:23px">3  Fortsetzen und verbessern</text>
  <text x="970" y="451" class="body" style="font-size:18px">Entscheidungen und klare Übergabe sichern.</text>
  <text x="970" y="491" class="body">Aus Projektaufzeichnungen fortsetzen.</text>
  <text x="970" y="531" class="body">Beobachtete Fehler festhalten.</text>
  <text x="970" y="580" class="small muted">Regel, Hook oder Test vorschlagen.</text>
  <text x="970" y="611" class="small muted">Änderung vor der Übernahme validieren.</text>
  <text x="700" y="693" text-anchor="middle" class="small muted">Anweisungen lenken das Verhalten. Konfigurierte Prüfungen setzen bestimmte Grenzen durch.</text>
  <path d="M50 723 H1350" stroke="#455575" stroke-width="2"/>
  <text x="700" y="770" text-anchor="middle" class="heading">Erlebe den Unterschied an einer Aufgabe</text>
  <text x="700" y="809" text-anchor="middle" class="body muted" style="font-size:17px">Wegwerf-Demo: fehlgeschlagene Prüfung → begrenzte Korrektur → Prüfungen + echter Ablauf → Protokoll → Übergabe / Fortsetzung</text>
  <text x="700" y="914" text-anchor="middle" class="small muted">Danach: endliche Maker/Checker-Durchläufe mit freigegebenem Umfang und ausdrücklichen Grenzen.</text>
  <text x="700" y="948" text-anchor="middle" font-size="17" class="muted">Deutsches Diagramm · 2026-10-02 · freigegebene Einleitung</text>
</svg>
