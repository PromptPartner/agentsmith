name: verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Python core compiles
        run: python -m py_compile agentsmith.py native_launcher.py evaluate.py config/statusline.py scripts/autonomous-run.py scripts/first-loop-release-evidence.py scripts/generate-first-loop-proof.py scripts/test-agent-conformance.py scripts/test-autonomous-state.py scripts/test-doctor.py scripts/test-evaluate.py scripts/test-first-verified-loop-contracts.py scripts/test-secret-scan.py scripts/test-statusline.py scripts/test-tracker-consent.py scripts/test-update.py scripts/test-verify-receipts.py compatibility/test_registry.py
      - name: Registry schema and contract
        run: python compatibility/test_registry.py
      - name: Strict cross-platform conformance
        run: python scripts/test-agent-conformance.py --strict
      - name: First Verified Loop discovery and apply contracts
        run: python scripts/test-first-verified-loop-contracts.py --fvl02
      - name: First Verified Loop status and profile contracts
        run: python scripts/test-first-verified-loop-contracts.py --fvl03
      - name: First Verified Loop demo contracts
        run: python scripts/test-first-verified-loop-contracts.py --fvl04
      - name: First Verified Loop resume contracts
        run: python scripts/test-first-verified-loop-contracts.py --fvl05
      - name: First Verified Loop integrated value trace
        run: python scripts/test-first-verified-loop-contracts.py --fvl06
      - name: First Verified Loop public proof and documentation
        run: python scripts/test-first-verified-loop-contracts.py --fvl07
      - name: First Verified Loop release-evidence contracts
        run: python scripts/test-first-verified-loop-contracts.py --fvl08
      - name: Stable release updater
        run: python scripts/test-update.py
      - name: Cross-platform secret scanner fixtures
        run: python scripts/test-secret-scan.py
      - name: Cross-platform verification receipt fixtures
        run: python scripts/test-verify-receipts.py
      - name: Cross-platform tracker consent fixtures
        run: python scripts/test-tracker-consent.py
      - name: Cross-platform autonomous state fixtures
        run: python scripts/test-autonomous-state.py
      - name: Cross-platform doctor fixtures
        run: python scripts/test-doctor.py
      - name: Cross-platform evaluation fixtures
        run: python scripts/test-evaluate.py
      - name: Cross-platform statusline fixtures
        run: python scripts/test-statusline.py
      - name: PowerShell launcher parses and delegates
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/setup.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          & ./setup.ps1 --version
      - name: Record native First Verified Loop evidence
        run: python scripts/first-loop-release-evidence.py record --expected-commit "${{ github.sha }}" --output-root "${{ runner.temp }}" --output "${{ runner.temp }}/native-${{ runner.os }}.json"
      - name: Upload native First Verified Loop evidence
        uses: actions/upload-artifact@v7
        with:
          name: fvl08-native-${{ runner.os }}
          path: ${{ runner.temp }}/native-${{ runner.os }}.json
          retention-days: 14

  fvl08-release-evidence:
    name: aggregate native First Verified Loop evidence
    needs: [compatibility, posix-guardrails]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Download native reports
        uses: actions/download-artifact@v5
        with:
          pattern: fvl08-native-*
          path: release-evidence
          merge-multiple: true
      - name: Aggregate matching native reports
        run: python scripts/first-loop-release-evidence.py aggregate --expected-commit "${{ github.sha }}" --report release-evidence/native-Linux.json --report release-evidence/native-macOS.json --report release-evidence/native-Windows.json --output-root "${{ runner.temp }}" --output "${{ runner.temp }}/first-verified-loop-native-aggregate.json"
      - name: Upload aggregate First Verified Loop evidence
        uses: actions/upload-artifact@v7
        with:
          name: fvl08-native-aggregate
          path: ${{ runner.temp }}/first-verified-loop-native-aggregate.json
          retention-days: 14

  posix-guardrails:
    name: existing guardrails (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Security and harness invariant tests
        shell: bash
        run: |
          bash scripts/test-secret-scan.sh
          bash scripts/test-assemble.sh
          bash scripts/test-operator-identity.sh
          bash scripts/test-leak-gate.sh
          bash scripts/test-wayfinder-spec.sh
          bash scripts/test-ui-design-reminder.sh
          bash scripts/test-handoff-on-keyword.sh
          bash scripts/test-context-budget-nudge.sh
          bash scripts/test-autonomous-run.sh
