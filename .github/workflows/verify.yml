name: verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Python core compiles
        run: python -m py_compile agentsmith.py native_launcher.py evaluate.py config/statusline.py scripts/autonomous-run.py scripts/test-agent-conformance.py scripts/test-autonomous-state.py scripts/test-doctor.py scripts/test-evaluate.py scripts/test-secret-scan.py scripts/test-statusline.py scripts/test-tracker-consent.py compatibility/test_registry.py
      - name: Registry schema and contract
        run: python compatibility/test_registry.py
      - name: Strict cross-platform conformance
        run: python scripts/test-agent-conformance.py --strict
      - name: Cross-platform scanner, consent, state ownership, doctor, and evaluation fixtures
        run: |
          python scripts/test-secret-scan.py
          python scripts/test-tracker-consent.py
          python scripts/test-autonomous-state.py
          python scripts/test-doctor.py
          python scripts/test-evaluate.py
          python scripts/test-statusline.py
      - name: PowerShell launcher parses and delegates
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/setup.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          & ./setup.ps1 --version

  posix-guardrails:
    name: existing guardrails (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Security and harness invariant tests
        shell: bash
        run: |
          bash scripts/test-secret-scan.sh
          bash scripts/test-assemble.sh
          bash scripts/test-operator-identity.sh
          bash scripts/test-leak-gate.sh
          bash scripts/test-wayfinder-spec.sh
          bash scripts/test-ui-design-reminder.sh
          bash scripts/test-handoff-on-keyword.sh
          bash scripts/test-context-budget-nudge.sh
          bash scripts/test-autonomous-run.sh
