name: standalone builds

on:
  pull_request:
    paths:
      - agentsmith.py
      - agentsmith.spec
      - core/**
      - profiles/**
      - config/**
      - templates/**
      - skills/**
      - .github/workflows/standalone.yml
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: agentsmith-linux-x86_64
            executable: dist/agentsmith
          - os: windows-2025
            asset: agentsmith-windows-x86_64
            executable: dist/agentsmith.exe
          - os: macos-15
            asset: agentsmith-macos-arm64
            executable: dist/agentsmith
          - os: macos-15-intel
            asset: agentsmith-macos-x86_64
            executable: dist/agentsmith
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build standalone executable
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.22.3
          pyinstaller --clean --noconfirm agentsmith.spec
      - name: Exercise the standalone command
        shell: bash
        run: |
          "${{ matrix.executable }}" --version
          "${{ matrix.executable }}" profiles list --json > profile-catalog.json
          python -c "import json; p=json.load(open('profile-catalog.json', encoding='utf-8')); assert len(p['profiles']) == 10"
          smoke_target="${RUNNER_TEMP}/agentsmith-standalone-smoke"
          mkdir -p "$smoke_target"
          "${{ matrix.executable }}" install --agent github-copilot --profile software-dev --target "$smoke_target"
          "${{ matrix.executable }}" status --target "$smoke_target"
          test ! -e "$smoke_target/.agentsmith/agentsmith.py"
      - name: Package Unix executable
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "${{ matrix.asset }}.tar.gz" -C dist agentsmith
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/agentsmith.exe -DestinationPath "${{ matrix.asset }}.zip"
      - name: Upload tested build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.zip
          if-no-files-found: ignore
          retention-days: 14
      - name: Attest Unix build provenance
        if: github.event_name != 'pull_request' && runner.os != 'Windows'
        uses: actions/attest@v4
        with:
          subject-path: ${{ matrix.asset }}.tar.gz
      - name: Attest Windows build provenance
        if: github.event_name != 'pull_request' && runner.os == 'Windows'
        uses: actions/attest@v4
        with:
          subject-path: ${{ matrix.asset }}.zip
